<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - LifeLine Blood Bank</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script></head><body>
<div id="nav"></div><main class="container mt-4"><h1 class="h3">Admin dashboard</h1>
<ul class="nav nav-pills mb-3" id="tabs"><li class="nav-item"><button class="nav-link" data-t="dash">Dashboard</button></li><li class="nav-item"><button class="nav-link" data-t="inv">Inventory</button></li><li class="nav-item"><button class="nav-link" data-t="req">Requests</button></li><li class="nav-item"><button class="nav-link" data-t="don">Donations</button></li><li class="nav-item"><button class="nav-link" data-t="usr">Users</button></li><li class="nav-item"><button class="nav-link" data-t="msg">Messages</button></li><li class="nav-item"><button class="nav-link" data-t="rep">Reports</button></li></ul>
<div id="dash" class="tab"><div class="row g-2" id="cards"></div><div class="row g-3 mt-1"><div class="col-md-6"><div class="card p-3"><h2 class="h6">Stock by blood group</h2><canvas id="c1"></canvas></div></div><div class="col-md-6"><div class="card p-3"><h2 class="h6">Requests by status</h2><canvas id="c2"></canvas></div></div>
<div class="col-md-6"><div class="card p-3"><h2 class="h6">Units collected per month</h2><canvas id="c3"></canvas></div></div><div class="col-md-6"><div class="card p-3"><h2 class="h6">Units issued per month</h2><canvas id="c4"></canvas></div></div></div>
<div class="card p-3 mt-3"><h2 class="h6">Alerts</h2><div id="al"></div></div></div>
<div id="inv" class="tab card p-3"><h2 class="h5">Add inventory batch</h2><form id="if" class="row g-2"><div class="col-md-3"><input id="bc" class="form-control" placeholder="Batch code" required></div><div class="col-md-2"><select id="ig" class="form-select g" required></select></div><div class="col-md-2"><select id="ic" class="form-select c"></select></div>
<div class="col-md-1"><input id="iu" type="number" min="1" max="100" class="form-control" placeholder="Units" required></div><div class="col-md-2"><input id="icd" type="date" class="form-control" title="Collection date" required></div><div class="col-md-2"><input id="ied" type="date" class="form-control" title="Expiry date" required></div>
<div class="col-12"><button class="btn btn-danger btn-sm">Add batch (screening starts as Pending)</button></div><div class="col-12 m"></div></form><div id="it" class="mt-3"></div></div>
<div id="req" class="tab card p-3"><div class="row g-2 mb-2"><div class="col-6 col-md-2"><select id="fs" class="form-select"><option value="">All statuses</option><option>Pending</option><option>Under Review</option><option>Approved</option><option>Rejected</option><option>Ready for Issue</option><option>Issued</option><option>Cancelled</option></select></div>
<div class="col-6 col-md-2"><select id="fu" class="form-select"><option value="">Any urgency</option><option>Routine</option><option>Urgent</option><option>Emergency</option></select></div><div class="col-6 col-md-2"><select id="fb" class="form-select g"></select></div></div><div id="rt"></div></div>
<div id="don" class="tab card p-3"><div id="dt"></div></div><div id="usr" class="tab card p-3"><div id="ut"></div></div><div id="msg" class="tab card p-3"><div id="mt"></div></div>
<div id="rep" class="tab card p-3"><h2 class="h5">CSV reports</h2><div class="row g-2 mb-2"><div class="col-md-3"><select id="rg" class="form-select g"></select></div><div class="col-md-3"><input type="date" id="rf" class="form-control" title="From"></div><div class="col-md-3"><input type="date" id="rto" class="form-control" title="To"></div></div>
<a class="btn btn-outline-danger btn-sm me-2" href="#" onclick="rep('donations');return false">Download donations</a><a class="btn btn-outline-danger btn-sm me-2" href="#" onclick="rep('inventory');return false">Download inventory</a><a class="btn btn-outline-danger btn-sm me-2" href="#" onclick="rep('requests');return false">Download requests</a><a class="btn btn-outline-danger btn-sm me-2" href="#" onclick="rep('issues');return false">Download issues</a></div></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script>
const g=i=>document.getElementById(i),v=i=>g(i).value,B=(c,f,t)=>'<button class="btn btn-sm btn-outline-'+c+' me-1" onclick="'+f+'">'+t+'</button>';
nav().then(me=>{if(!me||me.role!=='admin')location.href='/admin-login.html'});fillSelects();
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));
let ch={};function chart(id,type,labels,data,label){if(ch[id])ch[id].destroy();ch[id]=new Chart(g(id),{type,data:{labels,datasets:[{label,data,backgroundColor:['#b02a37','#dc6b74','#e8a5ab','#6c757d','#adb5bd','#f1c40f','#198754','#0d6efd']}]},options:{plugins:{legend:{display:type==='doughnut'}}}})}
async function act(f){try{await f()}catch(e){alert(e.message)}show(cur)}
let cur='dash';
async function show(t){cur=t;document.querySelectorAll('.tab').forEach(e=>e.style.display=e.id===t?'':'none');document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
 if(t==='dash'){const s=await api('/admin/stats'),T=s.totals;
  g('cards').innerHTML=[['Users',T.users],['Donors',T.donors],['Recipients',T.recipients],['Pending requests',T.pending],['Approved requests',T.approved],['Fulfilled',T.fulfilled],['Units available',T.units]].map(x=>'<div class="col-6 col-md-3"><div class="card stat p-2"><b>'+esc(x[1])+'</b>'+x[0]+'</div></div>').join('');
  chart('c1','bar',s.byGroup.map(x=>x.blood_group),s.byGroup.map(x=>+x.units),'Units');chart('c2','doughnut',s.byStatus.map(x=>x.status),s.byStatus.map(x=>x.n),'Requests');
  chart('c3','bar',s.monthly.map(x=>x.m),s.monthly.map(x=>+x.units),'Units');chart('c4','bar',s.trend.map(x=>x.m),s.trend.map(x=>+x.units),'Units');
  const have=Object.fromEntries(s.byGroup.map(x=>[x.blood_group,+x.units])),low=G.filter(k=>(have[k]||0)<5);
  g('al').innerHTML='<p><b>Low stock (under 5 units):</b> '+(low.join(', ')||'none')+'</p><p><b>Expired or expiring within 7 days:</b></p>';table(g('al').appendChild(document.createElement('div')),s.expiring,[['Batch',x=>x.batch_code],['Group',x=>x.blood_group],['Component',x=>x.component],['Expiry',x=>D(x.expiry_date)],['Units',x=>x.units_available]])}
 if(t==='inv')table(g('it'),await api('/admin/inventory'),[['Batch',x=>x.batch_code],['Group',x=>x.blood_group],['Component',x=>x.component],['Available/Total',x=>x.units_available+'/'+x.units_total],['Collected',x=>D(x.collection_date)],['Expiry',x=>D(x.expiry_date)],['Screening',x=>x.screening_status],['Shown as available',x=>x.eligible?'Yes':'No']],
  x=>x.screening_status==='Pending'?B('success','scr('+x.id+',\'Passed\')','Passed')+B('danger','scr('+x.id+',\'Failed\')','Failed'):'');
 if(t==='req'){const q=new URLSearchParams({status:v('fs'),urgency:v('fu'),blood_group:v('fb')});
  const NX={'Pending':['Under Review'],'Under Review':['Approved','Rejected'],'Approved':['Ready for Issue'],'Ready for Issue':[]};
  table(g('rt'),await api('/admin/requests?'+q),[['ID',x=>x.request_code],['Group',x=>x.blood_group],['Component',x=>x.component],['Units',x=>x.units_required],['Urgency',x=>x.urgency],['Hospital',x=>x.hospital_name],['Status',x=>x.status]],
   x=>(NX[x.status]||[]).map(n=>B(n==='Rejected'?'danger':'primary','st('+x.id+',\''+n+'\')',n)).join('')+(x.status==='Ready for Issue'?B('success','issue('+x.id+',\''+x.blood_group+'\',\''+x.component+'\')','Issue'):'')+(['Pending','Under Review','Approved','Ready for Issue'].includes(x.status)?B('secondary','st('+x.id+',\'Cancelled\')','Cancel'):''))}
 if(t==='don')table(g('dt'),await api('/admin/donations'),[['Donor',x=>x.full_name],['Group',x=>x.blood_group],['City',x=>x.city],['Preferred',x=>D(x.preferred_date)],['Status',x=>x.status],['Units',x=>x.units||'']],
  x=>['Requested','Scheduled'].includes(x.status)?B('primary','dn('+x.id+',\'Scheduled\')','Schedule')+B('success','dn('+x.id+',\'Completed\')','Completed')+B('warning','dn('+x.id+',\'Deferred\')','Defer'):'');
 if(t==='usr')table(g('ut'),await api('/admin/users'),[['Name',x=>x.full_name],['Email',x=>x.email],['Mobile',x=>x.mobile],['Joined',x=>D(x.created_at)],['Active',x=>x.is_active?'Yes':'No']],x=>B(x.is_active?'danger':'success','act(()=>api(\'/admin/users/'+x.id+'/active\',\'PUT\',{active:'+(x.is_active?'false':'true')+'}))',x.is_active?'Deactivate':'Activate'));
 if(t==='msg')table(g('mt'),await api('/admin/messages'),[['From',x=>x.name+' <'+x.email+'>'],['Subject',x=>x.subject],['Message',x=>x.message],['Status',x=>x.status],['Notes',x=>x.admin_notes||'']],x=>B('primary','mg('+x.id+')','Update'))}
const scr=(id,s)=>confirm('Record screening as '+s+'?')&&act(()=>api('/admin/inventory/'+id+'/screening','PUT',{status:s}));
const st=(id,s)=>{let reason='';if(s==='Rejected'){reason=prompt('Reason for rejection:');if(!reason)return}if(confirm('Change status to '+s+'?'))act(()=>api('/admin/requests/'+id+'/status','PUT',{status:s,reason}))};
async function issue(id,gr,c){const inv=(await api('/admin/inventory')).filter(x=>x.eligible&&x.blood_group===gr&&x.component===c);
 const b=prompt('Enter the batch ID to issue from:\n'+(inv.map(x=>x.id+' = '+x.batch_code+' ('+x.units_available+' units, exp '+D(x.expiry_date)+')').join('\n')||'No eligible batches'));if(b)act(()=>api('/admin/requests/'+id+'/issue','POST',{inventory_id:+b}))}
function dn(id,s){let units;if(s==='Completed'){units=prompt('Units collected (1 or 2):');if(!units)return}act(()=>api('/admin/donations/'+id,'PUT',{status:s,units}))}
function mg(id){const s=prompt('Status: New, In Progress or Resolved');if(!s)return;const n=prompt('Follow-up notes:')||'';act(()=>api('/admin/messages/'+id,'PUT',{status:s,notes:n}))}
function rep(t){location.href='/api/admin/reports/'+t+'?format=csv&group='+encodeURIComponent(v('rg'))+'&from='+v('rf')+'&to='+v('rto')}
g('fs').onchange=g('fu').onchange=g('fb').onchange=()=>show('req');
g('if').onsubmit=async e=>{e.preventDefault();const m=e.target.querySelector('.m');try{await api('/admin/inventory','POST',{batch_code:v('bc'),blood_group:v('ig'),component:v('ic'),units:+v('iu'),collection_date:v('icd'),expiry_date:v('ied')});msg(m,'Batch added.',1);e.target.reset();show('inv')}catch(x){msg(m,x.message)}};
show('dash');
</script></body></html>
