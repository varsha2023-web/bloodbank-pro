<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - LifeLine Blood Bank</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body>
<div id="nav"></div><main class="container" style="max-width:520px"><div class="card p-4 mt-4"><h1 class="h4">Create an account</h1>
<form id="f"><label class="form-label" for="n">Full name</label><input id="n" class="form-control mb-2" required minlength="2">
<label class="form-label" for="e">Email</label><input id="e" type="email" class="form-control mb-2" required>
<label class="form-label" for="mo">Mobile number</label><input id="mo" class="form-control mb-2" required pattern="[6-9][0-9]{9}" title="10 digits starting with 6-9" inputmode="numeric">
<label class="form-label" for="p">Password</label><input id="p" type="password" class="form-control" required pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" title="8+ characters with a letter and a number">
<label class="form-label mt-2" for="c">Confirm password</label><input id="c" type="password" class="form-control" required>
<div class="form-check my-2"><input class="form-check-input" type="checkbox" id="sh"><label class="form-check-label" for="sh">Show passwords</label></div>
<div id="m"></div><button class="btn btn-danger w-100">Register</button></form><p class="mt-3 mb-0 small">Have an account? <a href="login.html">Log in</a></p></div></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script>
nav();const g=i=>document.getElementById(i);g('sh').onchange=e=>{g('p').type=g('c').type=e.target.checked?'text':'password'};
g('f').onsubmit=async e=>{e.preventDefault();try{await api('/auth/register','POST',{full_name:g('n').value,email:g('e').value,mobile:g('mo').value,password:g('p').value,confirm:g('c').value});
 msg(g('m'),'Account created. Redirecting to login...',1);setTimeout(()=>location.href='login.html',1200)}catch(x){msg(g('m'),x.message)}};
</script></body></html>
